
{% extends "base.html" %}

{% block mainbody %}

<div class="setup">
    <h1>Player Join</h1>

    <form method="POST" action="/start">

        Name : <input type="text" name="the_name"><br />
        Rows (3-10) : <input type="text" name="the_rows" min="3" max="10"><br />
        Columns (3-10) : <input type="text" name="the_columns" min="3" max="10"><br />

        <button type="submit">Start Game</button>

    </form>
</div>

{% endblock %}
