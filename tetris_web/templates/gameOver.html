
<div class="game-over">
    <h2>GAME OVER!</h2>
    <h3>{{ game.name }}</h3>

    <p>Score: {{ game.score }}</p>
    <p>Blocks: {{ game.blocks }}</p>
    <p>Time: {{ "%.1f"|format(game.elapsed) }} seconds</p>
    
    <form method="GET" action="/join">
        <button type="submit">Restart Game</button>
    </form>
</div>
